<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بازی | ARTIN GAMES</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at top, #20232e 0%, #0b0c10 45%, #050608 100%);
            color: #fff;
            min-height: 100vh;
        }

        header {
            background: rgba(10, 11, 15, .92);
            border-bottom: 1px solid #292c36;
            padding: 22px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(15px);
        }

        header h1 {
            font-size: 25px;
        }

        nav {
            display: flex;
            gap: 10px;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            transition: .25s;
        }

        nav a:hover {
            background: #ff3030;
            color: white;
        }

        .container {
            width: min(1100px, 92%);
            margin: 45px auto;
        }

        .game-details {
            background: linear-gradient(145deg, #171922, #0e0f14);
            border: 1px solid #292c36;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .game-cover-wrapper {
            width: 100%;
            background: #08090d;
            position: relative;
        }

        .game-cover {
            width: 100%;
            height: auto;
            max-height: 520px;
            display: block;
            object-fit: cover;
        }

        .content {
            padding: 35px;
        }

        .content h2 {
            font-size: 34px;
            margin-bottom: 15px;
        }

        .category {
            display: inline-block;
            background: #20232c;
            border: 1px solid #383b48;
            color: #ff6666;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .description {
            color: #aaa;
            line-height: 2;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #ff3030;
            padding: 13px 23px;
            border-radius: 11px;
            font-weight: bold;
            transition: .25s;
        }

        .button:hover {
            background: #d91f1f;
            transform: translateY(-2px);
        }

        .button.back {
            background: #252832;
        }

        .button.back:hover {
            background: #353946;
        }

        .not-found {
            text-align: center;
            padding: 100px 20px;
            background: #12141a;
            border: 1px solid #292c36;
            border-radius: 20px;
        }

        .not-found h2 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .not-found p {
            color: #999;
            margin-bottom: 25px;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
            }

            .content {
                padding: 25px;
            }

            .content h2 {
                font-size: 26px;
            }

            .game-cover {
                max-height: 300px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>🎮 ARTIN GAMES</h1>

    <nav>
        <a href="index.html">خانه</a>
        <a href="games.html">بازی‌ها</a>
    </nav>

</header>

<main class="container">

    <div id="gameDetails">
        در حال بارگذاری بازی...
    </div>

</main>

<script src="script.js"></script>

</body>
</html>
