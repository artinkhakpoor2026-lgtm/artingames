<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARTIN GAMES | کتابخانه بازی‌ها</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="games.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        <span>ARTIN</span>
        <b>GAMES</b>
    </div>

    <nav>
        <a href="index.html">خانه</a>
        <a href="games.html" class="active">بازی‌ها</a>
        <a href="index.html#news">آخرین اخبار</a>
    </nav>

</header>


<main>

<section class="games-hero">

    <span>ARTIN GAMES LIBRARY</span>

    <h1>
        دنیای بازی‌ها
    </h1>

    <p>
        هزاران عنوان بازی را جستجو و کشف کن.
    </p>

</section>


<section class="library-section">

    <div class="section-title">

        <div>
            <span>GAME LIBRARY</span>
            <h2>کتابخانه بازی‌ها</h2>
        </div>

        <div class="game-count" id="gameCount">
            ۰ بازی
        </div>

    </div>


    <div class="tools">

        <div class="search-box">

            <span>⌕</span>

            <input
                id="gameSearch"
                type="search"
                placeholder="نام بازی را جستجو کنید..."
            >

        </div>


        <div class="filters">

            <button class="filter-button active" data-filter="all">
                همه
            </button>

            <button class="filter-button" data-filter="action">
                اکشن
            </button>

            <button class="filter-button" data-filter="shooter">
                شوتر
            </button>

            <button class="filter-button" data-filter="rpg">
                RPG
            </button>

            <button class="filter-button" data-filter="horror">
                ترسناک
            </button>

            <button class="filter-button" data-filter="adventure">
                ماجراجویی
            </button>

            <button class="filter-button" data-filter="racing">
                مسابقه‌ای
            </button>

            <button class="filter-button" data-filter="sports">
                ورزشی
            </button>

        </div>

    </div>


    <div
        class="status-box"
        id="loadingBox"
    >
        در حال دریافت بازی‌ها...
    </div>


    <div
        class="games-grid"
        id="gamesGrid"
    ></div>


    <div
        class="no-results"
        id="noResults"
        hidden
    >

        <div>🎮</div>

        <h3>
            بازی پیدا نشد
        </h3>

        <p>
            نام دیگری را جستجو کنید.
        </p>

    </div>

</section>

</main>


<footer>

    <div class="footer-logo">
        ARTIN GAMES
    </div>

    <p>
        دنیای بازی‌ها، در یکجا.
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
