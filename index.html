<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARTIN // Game Archive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-grid"></div>

    <div class="glow glow-blue"></div>
    <div class="glow glow-purple"></div>

    <main>

        <!-- صفحه اصلی -->
        <section id="home" class="screen active">

            <div class="top-bar">
                <span>ARTIN // DIGITAL ARCHIVE</span>
                <span>● ONLINE</span>
            </div>

            <div class="hero">

                <p class="welcome">
                    WELCOME TO MY GAME WORLD
                </p>

                <button id="artinButton" class="artin-button">

                    <span class="outer-ring"></span>
                    <span class="inner-ring"></span>

                    <span class="artin-text">
                        ARTIN
                    </span>

                    <span class="click-text">
                        CLICK TO ENTER
                    </span>

                </button>

                <p class="enter-text">
                    ENTER THE ARCHIVE
                </p>

            </div>

            <div class="bottom-bar">
                <span>GAMES / COMPLETED</span>
                <span>© 2026 ARTIN</span>
            </div>

        </section>


        <!-- صفحه بازی‌ها -->
        <section id="games" class="screen">

            <div class="top-bar">

                <button id="backButton" class="back-button">
                    ← BACK
                </button>

                <span id="gameCount">
                    05 GAMES
                </span>

            </div>


            <div class="games-header">

                <p class="welcome">
                    ARTIN // COMPLETED GAMES
                </p>

                <h1>
                    GAME <span>ARCHIVE</span>
                </h1>

                <p class="description">
                    A collection of games completed by ARTIN.
                </p>

            </div>


            <div id="gamesGrid" class="games-grid"></div>


            <div class="bottom-bar">

                <span>
                    STATUS: ALL COMPLETED
                </span>

                <span>
                    ARTIN // GAME ARCHIVE
                </span>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
